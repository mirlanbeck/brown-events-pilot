name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: brownevents_test
          POSTGRES_USER: brown
          POSTGRES_PASSWORD: brown123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U brown -d brownevents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://brown:brown123@127.0.0.1:5432/brownevents_test
      TEST_DATABASE_URL: postgresql://brown:brown123@127.0.0.1:5432/brownevents_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Versions
        run: |
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      # Wall-clock formatting must not depend on the machine time zone (spec 5.5); Node honours TZ on Linux only.
      - name: Unit tests (three time zones)
        run: |
          for tz in UTC Asia/Bishkek America/Los_Angeles; do
            echo "TZ=$tz"
            TZ=$tz npm test -- --ci
          done

      - name: Integration tests
        run: npm run test:int -- --ci

      - name: Generate OpenAPI document
        run: npm run swagger:generate -- swagger.json

      - uses: actions/upload-artifact@v7
        with:
          name: swagger-json
          path: backend/swagger.json
          if-no-files-found: error

      - name: Docker build (migrator and runtime)
        run: |
          docker build --target migrator -t brownevents-migrator:ci .
          docker build --target runtime -t brownevents-api:ci .

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Versions
        run: |
          node --version
          npm --version
          docker --version
          docker compose version

      - name: Install
        run: npm ci

      # Before the stack: a type error fails the job in seconds, not after the image builds.
      - name: Type check
        run: npm run typecheck

      - name: Start the stack
        working-directory: .
        run: docker compose up -d --build

      # A curl loop instead of --wait: no dependence on how this compose version treats the finished migrate service.
      - name: Wait for the stack
        run: |
          for _ in $(seq 1 120); do
            if curl -fs -m 2 -o /dev/null http://127.0.0.1:5000/health && curl -fs -m 2 -o /dev/null http://127.0.0.1:5173/; then
              echo "stack is up"
              exit 0
            fi
            sleep 1
          done
          echo "stack did not come up in 120 s" >&2
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

      - name: Stack logs
        if: failure()
        working-directory: .
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the stack
        if: always()
        working-directory: .
        run: docker compose down -v
