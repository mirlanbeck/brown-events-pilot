version: '3.9'

services:

  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: brownevents
      POSTGRES_USER: brown
      POSTGRES_PASSWORD: brown123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brown -d brownevents"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: BrownEvents.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=brownevents;Username=brown;Password=brown123"
    ports:
      - "5000:80"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
